{% extends "base.html" %}
{% block title %}修改密码 · 532Lab{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>修改密码</h1>
    <p class="sub">密码使用 scrypt 加盐哈希存储，管理员也无法查看明文</p>
  </div>
</div>

<section class="card" style="max-width:480px">
  <form method="post" class="stack-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label><span>原密码</span><input type="password" name="old" autocomplete="current-password" required></label>
    <label><span>新密码（至少 8 位）</span><input type="password" name="new" autocomplete="new-password" required></label>
    <label><span>确认新密码</span><input type="password" name="confirm" autocomplete="new-password" required></label>
    <button class="btn btn-primary" type="submit">保存</button>
  </form>
</section>
{% endblock %}
